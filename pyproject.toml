[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "stereometry"
version = "1.0.0"
description = "Stereo metrology with calibration diagnostics, validity masks and depth sensitivity."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "opencv-python-headless>=4.8,<6"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.16,<0.17", "matplotlib>=3.7", "build>=1"]

[project.scripts]
stereometry = "stereometry.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]